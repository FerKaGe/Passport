<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport | Login</title>
    <link rel="icon" href="jogo/img/interface/favicon.png" />

    <link rel="stylesheet" href="./css/skins.css">
    <link rel="stylesheet" href="./css/tema.css">
    <link rel="stylesheet" href="./css/estilo.css">

    <script src="./js/sessao.js"></script>
    <script src="./js/skins.js"></script>
    <script>
        aplicarSkin(SKIN_PADRAO);
    </script>
</head>

<body>

    <header class="cabecalho">
        <div class="container">
            <a href="index.html" class="cabecalho-logo">
                <img src="jogo/img/interface/logo.png" alt="Passport: carimbe o mundo" />
            </a>
            <nav aria-label="Menu">
                <ul class="menu-publico">
                    <li><a href="index.html" class="placa">TELA INICIAL</a></li>
                    <li><a href="login.html" class="placa" aria-current="page">ENTRAR</a></li>
                    <li><a href="cadastro.html" class="placa">CRIAR CONTA</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="area-passaporte">
        <div class="container">

            <div class="passaporte-aberto">

                <section class="pagina-capa">
                    <img class="logo-passaporte" src="jogo/img/interface/logo.png" alt="" />
                    <h1>Olá de volta!</h1>
                    <img class="carimbo-enfeite" src="jogo/img/carimbos/atacama.png" alt="" />
                </section>

                <section class="pagina-papel">
                    <h2>Entrar</h2>

                    <form class="formulario" onsubmit="entrar(); return false;" novalidate>
                        <div class="campo">
                            <label for="email_input">E-mail</label>
                            <input id="email_input" type="email" autocomplete="email" />
                        </div>
                        <div class="campo">
                            <label for="senha_input">Senha</label>
                            <input id="senha_input" type="password" autocomplete="current-password" />
                        </div>

                        <button type="submit" class="botao-tema botao-passaporte">
                            <span class="botao-icone" aria-hidden="true"></span>
                            <span>ENTRAR</span>
                        </button>
                    </form>

                    <div id="div_aguardar" class="carregando">
                        <img src="jogo/img/interface/aviao.png" alt="" />
                        <span>Embarcando...</span>
                    </div>

                    <p id="cardErro" class="carimbo-mensagem negado" role="alert">
                        <b>NEGADO</b>
                        <span id="mensagem_erro"></span>
                    </p>
                    <p id="div_erros_login" class="carimbo-mensagem negado" role="alert"></p>

                    <p class="troca-de-pagina">Ainda não tem passaporte? <a href="cadastro.html">Crie uma conta</a>.</p>
                </section>

            </div>
        </div>
    </main>

    <footer class="rodape">
        <div class="container">
            Projeto Individual · SPTech · 2026
        </div>
    </footer>

</body>

</html>

<script>

    function entrar() {
        cardErro.style.display = "none";
        div_erros_login.style.display = "none";

        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Preencha o e-mail e a senha para entrar.";
            finalizarAguardar();
            setTimeout(sumirMensagem, 5000);
            return false;
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {

            if (resposta.ok) {
                resposta.json().then(json => {
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.TIPO_VIAGEM_USUARIO = json.tipoViagem;

                    if (json.skin.id == null) {
                        guardarSkin(SKIN_PADRAO);
                    } else {
                        guardarSkin(json.skin);
                    }

                    setTimeout(function () {
                        window.location = "./dashboard/dashboard.html";
                    }, 1000);

                });

            } else {
                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
            finalizarAguardar("Não foi possível falar com o servidor.");
        });

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
    }
</script>
