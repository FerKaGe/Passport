<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passport | Jogo</title>
    <link rel="icon" href="../assets/icon/favicon2.ico" />

    <link rel="stylesheet" href="../css/jogo.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />

    <!-- A ordem importa: jogo.js usa o vetor "fases", que está em fases.js -->
    <script src="../js/sessao.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/fases.js"></script>
    <script src="../js/jogo.js"></script>
</head>

<!--
    Ordem do onload:
    1. montarSidebar() escreve a barra lateral (js/sidebar.js)
    2. validarSessao() confere o login e escreve o nome na barra (js/sessao.js)
    3. prepararJogo() registra os ouvintes e carrega a primeira fase (js/jogo.js)
-->

<body class="glass-sidebar-page" onload="montarSidebar('jogo'), validarSessao(), prepararJogo()">

    <aside id="barra_lateral" class="glass-sidebar"></aside>

    <main class="palco">

        <div class="barra-topo">
            <a href="inicio.html">&larr; Portão de embarque</a>
            <span>ESPAÇO, SETA PARA CIMA OU CLIQUE = PULAR</span>
        </div>

        <!-- A moldura de fliperama é o fundo desta div; o tabuleiro fica no "buraco" dela -->
        <div class="moldura">

            <div id="div_tabuleiro" class="tabuleiro">

                <img id="img_viajante" class="viajante" src="../assets/jogo/personagem/correndo.gif" alt="Viajante" />
                <img id="img_obstaculo" class="obstaculo" src="../assets/jogo/obstaculos/cacto.png" alt="Obstáculo" />

                <!-- Painel: pontuação, destino atual, progresso da fase e carimbos ganhos -->
                <div class="painel">
                    <div>MILHAS <span id="span_milhas">0</span></div>
                    <div><span id="span_destino">ATACAMA</span> <span id="span_progresso">0/5</span></div>
                    <div id="div_passaporte" class="passaporte"></div>
                </div>

                <!-- Aparece quando o jogador ganha um carimbo (escrito pelo darCarimbo()) -->
                <div id="div_carimbo" class="carimbo"></div>

                <!-- Aparece no game over e no fim do jogo -->
                <div id="div_aviso" class="aviso"></div>

                <button id="btn_embarcar" class="embarcar" onclick="iniciarJogo()">EMBARCAR</button>

            </div>

        </div>

    </main>

</body>

</html>
