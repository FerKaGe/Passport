<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passport | Jogo</title>
    <link rel="icon" href="img/interface/favicon.png" />

    <link rel="stylesheet" href="../css/skins.css" />
    <link rel="stylesheet" href="../css/jogo.css" />
    <link rel="stylesheet" href="../css/tema.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />

    <script src="../js/sessao.js"></script>
    <script src="../js/skins.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/fases.js"></script>
    <script src="../js/jogo.js"></script>
</head>

<body class="glass-sidebar-page" onload="montarSidebar('jogo'), validarSessao(), prepararJogo()">

    <aside id="barra_lateral" class="glass-sidebar"></aside>

    <main class="palco">

        <div class="barra-topo">
            <a href="inicio.html" class="placa">&larr; TELA INICIAL</a>
            <span>ESPAÇO, SETA PARA CIMA OU CLIQUE = PULAR</span>
        </div>

        <div class="moldura">

            <div id="div_tabuleiro" class="tabuleiro">

                <img id="img_viajante" class="viajante" src="img/personagem/correndo.gif" alt="Viajante" />
                <img id="img_obstaculo" class="obstaculo" src="img/obstaculos/cacto.gif" alt="Obstáculo" />

                <div class="painel">

                    <div class="cartao-embarque">
                        <div class="campo">
                            <small>DESTINO</small>
                            <span id="span_destino" class="valor">ATACAMA</span>
                        </div>
                        <div class="campo">
                            <small>MILHAS</small>
                            <span id="span_milhas" class="valor">0</span>
                        </div>
                        <div class="campo canhoto">
                            <small>TRECHO <span id="span_progresso">0/5</span></small>
                            <div class="rota">
                                <img id="img_aviaozinho" class="aviaozinho" src="img/interface/aviao-tinta.png" alt="" />
                            </div>
                        </div>
                    </div>

                    <div id="div_passaporte" class="passaporte" aria-label="Carimbos ganhos"></div>

                </div>

                <div id="div_carimbo" class="carimbo"></div>

                <div id="div_aviso" class="aviso"></div>

                <button id="btn_embarcar" class="botao-tema botao-passaporte" onclick="iniciarJogo()">
                    <span class="botao-icone" aria-hidden="true"></span>
                    <span id="span_botao">EMBARCAR</span>
                </button>

            </div>

        </div>

    </main>

</body>

</html>
