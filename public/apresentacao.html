<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport | Apresentação</title>
    <link rel="icon" href="jogo/img/interface/favicon.png" />

    <link rel="stylesheet" href="./css/apresentacao.css">

    <script src="./js/apresentacao.js"></script>
</head>

<body onload="iniciarApresentacao()">

    <div class="deck-viewport">
        <main class="deck-stage" id="palco">

    <section class="slide capa">
        <img class="capa-fundo" src="jogo/img/fundos/atacama.png" alt="">
        <div class="capa-conteudo">
            <img class="capa-logo surgir" src="jogo/img/interface/logo.png" alt="Passport: carimbe o mundo">
            <h1 class="capa-nome surgir">Fernando Mateus Santos</h1>
            <p class="capa-sub surgir">Projeto Individual · Pesquisa e Inovação · SPTech · 2026.2</p>
        </div>
        <img class="capa-carimbo carimbar" style="--giro: -14deg" src="jogo/img/carimbos/atacama.png" alt="">
    </section>

        </main>
    </div>

    <nav class="deck-controls" aria-label="Progresso da apresentação">
        <div class="progresso" id="div_progresso"></div>
    </nav>

    <div class="cronometro" id="div_cronometro"></div>

    <div class="aviso-edicao">MODO EDIÇÃO · CTRL+S BAIXA O ARQUIVO · ESC SAI</div>

</body>

</html>
