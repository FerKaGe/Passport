<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passport | Cadastro</title>
  <link rel="icon" href="jogo/img/interface/favicon.png" />

  <!-- Esta página não carrega o js/skins.js: fica sempre na skin padrão -->
  <link rel="stylesheet" href="./css/skins.css" />
  <link rel="stylesheet" href="./css/tema.css" />
  <link rel="stylesheet" href="./css/estilo.css" />

  <script src="./js/sessao.js"></script>
</head>

<body onload="carregarTiposDeViagem()">

  <header class="cabecalho">
    <div class="container">
      <a href="index.html" class="cabecalho-logo">
        <img src="jogo/img/interface/logo.png" alt="Passport: carimbe o mundo" />
      </a>
      <nav aria-label="Menu">
        <ul class="menu-publico">
          <li><a href="index.html" class="placa">TELA INICIAL</a></li>
          <li><a href="login.html" class="placa">ENTRAR</a></li>
          <li><a href="cadastro.html" class="placa" aria-current="page">CRIAR CONTA</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="area-passaporte">
    <div class="container">

      <!-- Elemento tematizado: um passaporte aberto, com o formulário na página de papel -->
      <div class="passaporte-aberto">

        <section class="pagina-capa">
          <img class="logo-passaporte" src="jogo/img/interface/logo.png" alt="" />
          <h1>Bem-vindo a bordo!</h1>
          <img class="carimbo-enfeite" src="jogo/img/carimbos/orlando.png" alt="" />
        </section>

        <section class="pagina-papel">
          <h2>Criar conta</h2>

          <!-- onsubmit: o cadastrar() roda pelo botão ou pelo Enter -->
          <form class="formulario" onsubmit="cadastrar(); return false;" novalidate>
            <div class="campo">
              <label for="nome_input">Nome</label>
              <input id="nome_input" type="text" autocomplete="name" />
            </div>
            <div class="campo">
              <label for="email_input">E-mail</label>
              <input id="email_input" type="email" autocomplete="email" />
            </div>
            <div class="campo">
              <label for="senha_input">Senha</label>
              <input id="senha_input" type="password" autocomplete="new-password" />
            </div>
            <div class="campo">
              <label for="confirmacao_senha_input">Confirme a senha</label>
              <input id="confirmacao_senha_input" type="password" autocomplete="new-password" />
            </div>
            <div class="campo">
              <!-- As opções são escritas pelo carregarTiposDeViagem(), com os dados do banco -->
              <label for="tipo_viagem_select">Que tipo de viagem você prefere?</label>
              <select id="tipo_viagem_select">
                <option value="">Carregando...</option>
              </select>
            </div>

            <button type="submit" class="botao-tema botao-passaporte">
              <span class="botao-icone" aria-hidden="true"></span>
              <span>CRIAR CONTA</span>
            </button>
          </form>

          <!-- O finalizarAguardar() de js/sessao.js esconde esta div -->
          <div id="div_aguardar" class="carregando">
            <img src="jogo/img/interface/aviao.png" alt="" />
            <span>Embarcando...</span>
          </div>

          <!-- A mensagem é um carimbo: NEGADO (erro) ou APROVADO (deu certo).
               role="alert" faz o leitor de tela ler a mensagem quando ela aparece. -->
          <p id="cardErro" class="carimbo-mensagem negado" role="alert">
            <b id="b_carimbo">NEGADO</b>
            <span id="mensagem_erro"></span>
          </p>

          <p class="troca-de-pagina">Já tem passaporte? <a href="login.html">Entre</a>.</p>
        </section>

      </div>
    </div>
  </main>

  <footer class="rodape">
    <div class="container">
      Projeto Individual · SPTech · 2026
    </div>
  </footer>

</body>

</html>

<script>

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var tipoViagemVar = tipo_viagem_select.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      tipoViagemVar == ""
    ) {
      mostrarMensagem("Preencha todos os campos para se cadastrar.", "negado");
      return false;
    }

    // Verificando se a senha foi digitada igual nos dois campos
    if (senhaVar != confirmacaoSenhaVar) {
      mostrarMensagem("A senha e a confirmação da senha estão diferentes.", "negado");
      return false;
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        tipoViagemServer: tipoViagemVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          mostrarMensagem("Cadastro realizado com sucesso! Indo para a tela de login...", "aprovado");

          setTimeout(() => {
            window.location = "login.html";
          }, 2000);
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        mostrarMensagem("Não foi possível fazer o cadastro. Tente de novo.", "negado");
      });

    return false;
  }

  // Busca os tipos de viagem no banco (rota /viagens/tipos) e escreve uma
  // <option> para cada um. O value é o id: é ele que vai para o cadastro.
  function carregarTiposDeViagem() {
    fetch("/viagens/tipos")
      .then(function (resposta) {
        return resposta.json();
      })
      .then(function (tipos) {
        var html = `<option value="">Escolha uma opção</option>`;

        for (var i = 0; i < tipos.length; i++) {
          html += `<option value="${tipos[i].id}">${tipos[i].nome}: ${tipos[i].descricao}</option>`;
        }

        tipo_viagem_select.innerHTML = html;
      })
      .catch(function (erro) {
        console.log("Erro ao buscar os tipos de viagem: ", erro);
        tipo_viagem_select.innerHTML = `<option value="">Não foi possível carregar</option>`;
      });
  }

  // Mostra a mensagem como um carimbo e esconde sozinho depois de 5 segundos.
  // tipo: "negado" (vermelho, erro) ou "aprovado" (verde, deu certo).
  // A classe CSS muda a cor (css/estilo.css, .carimbo-mensagem).
  // (setTimeout roda uma vez só; o setInterval que havia aqui criava um
  // temporizador novo a cada clique e nenhum deles parava.)
  function mostrarMensagem(texto, tipo) {
    cardErro.className = "carimbo-mensagem " + tipo;
    b_carimbo.innerHTML = tipo.toUpperCase();
    mensagem_erro.innerHTML = texto;
    cardErro.style.display = "block";
    finalizarAguardar();
    setTimeout(sumirMensagem, 5000);
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
