<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="icon" href="../jogo/img/interface/favicon.png" />
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport | Calculadora de custo</title>

    <link rel="stylesheet" href="../css/skins.css" />
    <link rel="stylesheet" href="../css/dashboards.css">
    <link rel="stylesheet" href="../css/tema.css">
    <link rel="stylesheet" href="../css/sidebar.css">

    <script src="../js/sessao.js"></script>
    <script src="../js/skins.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/custos.js"></script>
    <script src="../js/calculadora.js"></script>
</head>

<body class="glass-sidebar-page" onload="montarSidebar('calculadora'), validarSessao(), carregarCalculadora()">

    <aside id="barra_lateral" class="glass-sidebar"></aside>

    <main class="conteudo">
        <h1>Calculadora de custo</h1>
        <p class="subtitulo">Quanto custaria fazer uma destas viagens, saindo de São Paulo.</p>

        <div class="calculadora">

            <form class="painel formulario-calculo" onsubmit="calcular(); return false;" novalidate>
                <div class="campo">
                    <label for="select_destino">Destino</label>
                    <select id="select_destino">
                        <option value="">Carregando...</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="select_tipo">Tipo de viagem</label>
                    <select id="select_tipo" onchange="carregarCustos()">
                        <option>Carregando...</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="input_dias">Dias (de 1 a 90)</label>
                    <input id="input_dias" type="number" min="1" max="90" step="1" value="7" />
                </div>

                <div class="campo">
                    <label for="input_pessoas">Pessoas (de 1 a 10)</label>
                    <input id="input_pessoas" type="number" min="1" max="10" step="1" value="1" />
                </div>

                <button type="submit" class="botao-tema botao-mala">
                    <span class="botao-icone" aria-hidden="true"></span>
                    <span>FAZER A MALA</span>
                </button>

                <p id="p_mensagem" class="aviso" aria-live="polite"></p>
            </form>

            <div id="div_recibo" class="recibo" aria-live="polite"></div>

        </div>
    </main>

</body>

</html>
